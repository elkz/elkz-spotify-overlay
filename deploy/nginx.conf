# nginx site for the overlay. Copy to /etc/nginx/sites-available/elkz-spotify,
# change server_name, link it into sites-enabled, then get a certificate:
#   sudo certbot --nginx -d music.example.com
server {
    listen 80;
    server_name music.example.com;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # live updates to the overlay: don't buffer, keep the connection open
    location /events {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
